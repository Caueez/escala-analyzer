<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Entrar · Escala Visual</title><link rel="stylesheet" href="/static/styles.css"><link rel="stylesheet" href="/static/account.css"><script defer src="/static/auth.js"></script></head>
<body class="identity-page"><main class="identity-card"><div class="eyebrow">ESCALA VISUAL</div><h1>Entre na sua conta</h1><p>Acesse os projetos da sua empresa.</p><form id="loginForm" method="post" action="/api/auth/login"><label>Email<input name="email" type="email" autocomplete="username" required maxlength="254"></label><label>Senha<input name="password" type="password" autocomplete="current-password" required maxlength="128"></label><p id="authError" role="alert" aria-live="polite"></p><button class="button button-primary" type="submit">Entrar</button></form><p class="muted">Precisa de acesso ou esqueceu sua senha? Contate o administrador da sua empresa.</p></main></body></html>
