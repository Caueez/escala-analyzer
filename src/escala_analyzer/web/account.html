<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Minha conta · Escala Visual</title><link rel="stylesheet" href="/static/styles.css"><link rel="stylesheet" href="/static/account.css"><script defer src="/static/auth.js"></script></head>
<body class="identity-page"><main class="identity-card identity-wide"><a href="/">← Voltar às escalas</a><h1>Minha conta</h1><p id="currentIdentity"></p><p id="authError" role="alert" aria-live="polite"></p><button id="logoutButton" class="button">Sair</button><h2>Alterar senha</h2><form id="passwordForm" method="post" action="/api/auth/password"><label>Senha atual<input name="current_password" type="password" autocomplete="current-password" required maxlength="128"></label><label>Nova senha (12 a 128 caracteres)<input name="new_password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><button class="button button-primary" type="submit">Alterar e encerrar sessões</button></form><section id="userManagement" hidden><h2>Usuários da empresa</h2><div id="usersList"></div><h3>Criar usuário</h3><form id="createUserForm" method="post" action="/api/users"><label>Nome<input name="name" required maxlength="120"></label><label>Email<input name="email" type="email" autocomplete="off" required></label><label>Senha inicial (12 a 128 caracteres)<input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><label>Permissão<select name="role"><option value="editor">Editor</option><option value="viewer">Leitura</option><option value="admin">Administrador</option></select></label><button class="button button-primary" type="submit">Criar usuário</button></form></section></main></body></html>
