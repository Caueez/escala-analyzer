name: release-candidate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install uv
        run: python -m pip install uv==0.13.4
      - name: Install locked development dependencies
        run: uv sync --locked --extra dev
      - name: Lint and formatting
        run: |
          uv run ruff check src tests migrations scripts
          uv run ruff format --check src tests migrations scripts
      - name: Type check
        run: uv run pyright --pythonpath .venv/bin/python src
      - name: Regression and security tests
        run: uv run pytest -q
      - name: Generate isolated environment
        run: python scripts/generate_env.py --development
      - name: Start real infrastructure
        run: docker compose -p escala-ci up --build --wait --wait-timeout 180
      - name: Check PostgreSQL schema against migration
        run: docker compose -p escala-ci exec -T app alembic check
      - name: Exercise real API and workers
        run: uv run python scripts/smoke_saas.py --env-file .env --project escala-ci --url http://localhost:8000 --check-broker-restart
      - name: Test backup restore
        run: bash scripts/check_restore.sh escala-ci .env
      - name: Dependency vulnerabilities
        run: uvx pip-audit --path .venv/lib/python3.13/site-packages
      - name: Service diagnostics on failure
        if: failure()
        run: docker compose -p escala-ci logs --tail 80 app migrate dispatcher analysis-worker optimization-worker
      - name: Remove isolated test resources
        if: always()
        run: docker compose -p escala-ci down -v --remove-orphans
