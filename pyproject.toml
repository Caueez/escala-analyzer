[project]
name = "escala-analyzer"
version = "0.2.0rc1"
description = "Editor visual de escalas de trabalho com análise anual de cobertura e regras configuráveis."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.17,<2",
    "argon2-cffi>=25,<26",
    "celery>=5.6,<6",
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<1.0",
    "ortools>=9.14,<10",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn[standard]>=0.34,<1.0",
]


[project.optional-dependencies]
dev = ["pytest>=8.3,<10.0", "httpx>=0.27,<1.0"]

[project.scripts]
escala-analyzer = "escala_analyzer.main:run"
escala-admin = "escala_analyzer.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/escala_analyzer"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.17.1",
]
