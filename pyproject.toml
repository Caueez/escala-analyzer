[project]
name = "escala-analyzer"
version = "0.1.0"
description = "Editor visual de escalas de trabalho com análise anual de cobertura e regras configuráveis."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
]


[project.optional-dependencies]
dev = ["pytest>=8.3,<10.0", "httpx>=0.27,<1.0"]

[project.scripts]
escala-analyzer = "escala_analyzer.main:run"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/escala_analyzer"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.17.1",
]
